<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Research orbit — Hyperion docs</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      body {
        padding: 0.25rem;
        font-family: 'Lexend', 'Inter', ui-sans-serif, system-ui, sans-serif;
      }
      .research-orbit {
        color: #e2e8f0;
      }
      .kicker {
        margin: 0 0 0.3rem;
        color: #94a3b8;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      header h2 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 750;
        letter-spacing: -0.02em;
      }
      .sub {
        margin: 0.35rem 0 0.85rem;
        color: #94a3b8;
        font-size: 0.85rem;
      }
      .orbit-svg {
        display: block;
        width: 100%;
        max-width: 34rem;
        height: auto;
        margin: 0 auto;
        border-radius: 12px;
        background: radial-gradient(circle at 50% 46%, rgba(56, 189, 248, 0.12), transparent 62%);
      }
      .ring {
        fill: none;
        stroke: rgba(148, 163, 184, 0.3);
        stroke-dasharray: 4 8;
        transform-origin: 200px 140px;
        animation: orbit-spin 46s linear infinite;
      }
      .ring-outer {
        stroke: rgba(139, 92, 246, 0.28);
        animation-direction: reverse;
        animation-duration: 68s;
      }
      .spoke {
        stroke-width: 1.1;
        opacity: 0.45;
      }
      .core-glow {
        filter: blur(1px);
      }
      .core {
        fill: rgba(8, 20, 38, 0.85);
        stroke: #67e8f9;
        stroke-width: 1.6;
      }
      .core-label {
        fill: #e0f2fe;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .node {
        fill: rgba(15, 23, 42, 0.8);
        stroke: #a78bfa;
        stroke-width: 1.4;
      }
      .node-dot {
        fill: #c4b5fd;
      }
      .node-label {
        fill: #cbd5e1;
        font-size: 9.5px;
        font-weight: 650;
      }
      .note {
        margin: 0.8rem 0 0;
        color: #94a3b8;
        font-size: 0.74rem;
      }

      @media (prefers-reduced-motion: reduce) {
        .ring {
          animation: none;
        }
      }

      @keyframes orbit-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Prebuilt export of ResearchOrbit.astro (seed=42). Rebuild with `npm run build:astro` when the Astro toolchain resolves cleanly. -->
    <section class="research-orbit" id="ro-42" aria-labelledby="ro-42-title">
      <header>
        <p class="kicker">Astro island · docs site</p>
        <h2 id="ro-42-title">Research orbit</h2>
        <p class="sub">Domain nodes in orbit around applied research (illustrative, static export).</p>
      </header>
      <svg viewBox="0 0 400 280" role="img" aria-label="Research orbit" class="orbit-svg">
        <defs>
          <radialGradient id="ro-42-core" cx="50%" cy="50%">
            <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.15" />
          </radialGradient>
          <linearGradient id="ro-42-spoke" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="100%" stop-color="#a78bfa" />
          </linearGradient>
        </defs>

        <circle cx="200" cy="140" r="96" class="ring ring-outer" />
        <circle cx="200" cy="140" r="72" class="ring" />

        <line x1="200" y1="140" x2="200" y2="56" class="spoke" stroke="url(#ro-42-spoke)" />
        <line x1="200" y1="140" x2="270" y2="99" class="spoke" stroke="url(#ro-42-spoke)" />
        <line x1="200" y1="140" x2="276" y2="184" class="spoke" stroke="url(#ro-42-spoke)" />
        <line x1="200" y1="140" x2="200" y2="225" class="spoke" stroke="url(#ro-42-spoke)" />
        <line x1="200" y1="140" x2="133" y2="178" class="spoke" stroke="url(#ro-42-spoke)" />
        <line x1="200" y1="140" x2="129" y2="99" class="spoke" stroke="url(#ro-42-spoke)" />

        <circle cx="200" cy="140" r="30" class="core-glow" fill="url(#ro-42-core)" />
        <circle cx="200" cy="140" r="22" class="core" />
        <text x="200" y="144" text-anchor="middle" class="core-label">VGP</text>

        <g>
          <circle cx="200" cy="56" r="15" class="node" />
          <circle cx="200" cy="56" r="3" class="node-dot" />
          <text x="200" y="84" text-anchor="middle" class="node-label">Research</text>
        </g>
        <g>
          <circle cx="270" cy="99" r="15" class="node" />
          <circle cx="270" cy="99" r="3" class="node-dot" />
          <text x="270" y="127" text-anchor="middle" class="node-label">Graph</text>
        </g>
        <g>
          <circle cx="276" cy="184" r="15" class="node" />
          <circle cx="276" cy="184" r="3" class="node-dot" />
          <text x="276" y="212" text-anchor="middle" class="node-label">Metrics</text>
        </g>
        <g>
          <circle cx="200" cy="225" r="15" class="node" />
          <circle cx="200" cy="225" r="3" class="node-dot" />
          <text x="200" y="253" text-anchor="middle" class="node-label">Assets</text>
        </g>
        <g>
          <circle cx="133" cy="178" r="15" class="node" />
          <circle cx="133" cy="178" r="3" class="node-dot" />
          <text x="133" y="206" text-anchor="middle" class="node-label">Storyboards</text>
        </g>
        <g>
          <circle cx="129" cy="99" r="15" class="node" />
          <circle cx="129" cy="99" r="3" class="node-dot" />
          <text x="129" y="127" text-anchor="middle" class="node-label">Simulation</text>
        </g>
      </svg>
      <p class="note">Built as a static Astro island for the Docusaurus docs dashboard (MFP5).</p>
    </section>
  </body>
</html>
