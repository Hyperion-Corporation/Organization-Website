apiVersion: apps/v1
kind: Deployment
metadata:
  name: organization-website
  labels:
    app: organization-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: organization-website
  template:
    metadata:
      labels:
        app: organization-website
    spec:
      containers:
        - name: site
          # TODO: point at your real registry once infra/global/docker/Dockerfile is published there.
          image: organization-website:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
